# En cada pull request: busca secretos en los commits y comprueba que la
# aplicación compila. No despliega nada y no usa ningún secreto del repositorio.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks sobre los commits del pull request
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          base="${{ github.event.pull_request.base.sha }}"
          /tmp/gitleaks git --redact --no-banner ${base:+--log-opts="$base..HEAD"}

  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tipos de TypeScript
        run: |
          node scripts/ensure-carto-key.mjs
          npx --no-install tsc -p tsconfig.app.json --noEmit
      - name: Compilación
        # El paquete inicial pasa del presupuesto de tamaño de angular.json y `ng build`
        # termina con error por eso. Ese error, y solo ese, es conocido: cualquier otro
        # (tipos, plantillas, el presupuesto de estilos de un componente) hace fallar el paso.
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/ng-build.log
          salida=${PIPESTATUS[0]}
          set -e
          conocido='bundle initial exceeded maximum budget'
          otros=$(grep -F '[ERROR]' /tmp/ng-build.log | grep -v -F "$conocido" || true)
          if [ -n "$otros" ]; then echo "::error::Errores de compilación"; echo "$otros"; exit 1; fi
          if [ "$salida" != 0 ] && ! grep -q -F "$conocido" /tmp/ng-build.log; then
            echo "::error::La compilación terminó con error y sin diagnóstico reconocible"; exit 1
          fi
